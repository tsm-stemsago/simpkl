        window.SURAT = SURAT;

        /* ---------- Ekspor Word (.docx): membaca isi surat di layar, termasuk suntingan pengguna ---------- */
        const WORD = {
            load: async function() {
                if(window.docx) return window.docx;
                const res = await fetch('https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.umd.cjs');
                if(!res.ok) throw new Error('Pustaka Word tidak dapat diunduh (HTTP ' + res.status + '). Periksa koneksi internet.');
                const url = URL.createObjectURL(new Blob([await res.text()], { type: 'text/javascript' }));
                await new Promise((ok, fail) => {
                    const s = document.createElement('script');
                    s.src = url; s.onload = ok; s.onerror = () => fail(new Error('Pustaka Word gagal dimuat.'));
                    document.head.appendChild(s);
                });
                URL.revokeObjectURL(url);
                if(!window.docx) throw new Error('Pustaka Word tidak tersedia.');
                return window.docx;
            },

            build: async function(pages, f4) {
                const D = await this.load();
                const W = 11906, H = f4 ? 18709 : 16838, MX = 1134, MY = 794, CW = W - 2 * MX;   // satuan twip
                let olInstance = 0;

                const len = (v, base) => {
                    if(!v) return null;
                    const m = /^(-?[\d.]+)(px|pt|%|cm|mm)?$/.exec(String(v).trim());
                    if(!m) return null;
                    const n = parseFloat(m[1]);
                    switch(m[2]) {
                        case 'pt': return Math.round(n * 20);
                        case '%': return base ? Math.round(base * n / 100) : null;
                        case 'cm': return Math.round(n * 567);
                        case 'mm': return Math.round(n * 56.7);
                        default: return Math.round(n * 15);
                    }
                };
                const halfPt = (v) => { const m = /^([\d.]+)(pt|px)$/.exec(v || ''); return m ? Math.round(parseFloat(m[1]) * (m[2] === 'pt' ? 2 : 1.5)) : null; };
                const alignOf = (a) => ({ center: D.AlignmentType.CENTER, right: D.AlignmentType.RIGHT, justify: D.AlignmentType.JUSTIFIED }[a] || D.AlignmentType.LEFT);
                const isBlock = (n) => n.nodeType === 1 && ['TABLE','DIV','P','OL','UL','H1','H2','H3','HR'].includes(n.tagName);

                // Bagian inline: { t, f } teks, { br }, { img }
                const parts = (node, fmt) => {
                    if(node.nodeType === 3) {
                        const t = node.nodeValue.replace(/[ \t\r\n]+/g, ' ');
                        return t ? [{ t, f: fmt }] : [];
                    }
                    if(node.nodeType !== 1) return [];
                    const tag = node.tagName;
                    if(tag === 'BR') return [{ br: true }];
                    if(tag === 'IMG') return imgPart(node);
                    const f = { ...fmt }, st = node.style;
                    if(tag === 'B' || tag === 'STRONG' || st.fontWeight === 'bold' || parseInt(st.fontWeight, 10) >= 600) f.bold = true;
                    if(tag === 'I' || tag === 'EM' || st.fontStyle === 'italic') f.italics = true;
                    if(tag === 'U' || (st.textDecorationLine || st.textDecoration || '').includes('underline')) f.underline = {};
                    const fs = halfPt(st.fontSize); if(fs) f.size = fs;
                    return [...node.childNodes].flatMap(ch => parts(ch, f));
                };
                const imgPart = (img) => {
                    const m = /^data:image\/(png|jpe?g|gif);base64,(.*)$/i.exec(img.getAttribute('src') || '');
                    if(!m) return [];
                    const data = Uint8Array.from(atob(m[2]), c => c.charCodeAt(0));
                    const w = parseInt(img.style.width, 10) || img.naturalWidth || 64;
                    const h = (img.style.height && img.style.height !== 'auto') ? parseInt(img.style.height, 10) : Math.round(w * (img.naturalHeight || 1) / (img.naturalWidth || 1));
                    return [{ img: { data, w, h, type: m[1].toLowerCase().replace('jpeg', 'jpg') } }];
                };
                const toRuns = (ps) => {
                    const arr = ps.map(x => ({ ...x }));
                    while(arr.length && arr[0].t !== undefined && /^ +$/.test(arr[0].t)) arr.shift();
                    if(arr.length && arr[0].t !== undefined) arr[0].t = arr[0].t.replace(/^ +/, '');
                    while(arr.length && arr[arr.length - 1].t !== undefined && /^ +$/.test(arr[arr.length - 1].t)) arr.pop();
                    if(arr.length && arr[arr.length - 1].t !== undefined) arr[arr.length - 1].t = arr[arr.length - 1].t.replace(/ +$/, '');
                    return arr.filter(x => x.t === undefined || x.t !== '').map(x => {
                        if(x.br) return new D.TextRun({ break: 1 });
                        if(x.img) return new D.ImageRun({ type: x.img.type, data: x.img.data, transformation: { width: x.img.w, height: x.img.h } });
                        return new D.TextRun({ text: x.t, ...x.f });
                    });
                };

                const spacer = (twips) => new D.Paragraph({ children: [], run: { size: 2 }, spacing: { before: 0, after: 0, line: Math.max(20, twips), lineRule: D.LineRuleType.EXACT } });
                const none = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' };

                const ctxFrom = (el, ctx) => {
                    const st = el.style, n = { ...ctx, fmt: { ...ctx.fmt } };
                    if(st.textAlign) n.align = st.textAlign;
                    const ml = len(st.marginLeft, CW); if(ml) n.indent = (ctx.indent || 0) + ml;
                    if(st.fontWeight === 'bold' || parseInt(st.fontWeight, 10) >= 600) n.fmt.bold = true;
                    if((st.textDecorationLine || st.textDecoration || '').includes('underline')) n.fmt.underline = {};
                    const fs = halfPt(st.fontSize); if(fs) n.fmt.size = fs;
                    return n;
                };

                const para = (ps, ctx, extra) => new D.Paragraph({
                    children: toRuns(ps), alignment: alignOf(ctx.align),
                    indent: ctx.indent ? { left: ctx.indent } : undefined, ...extra
                });

                const convertChildren = (parent, ctx) => {
                    const out = []; let buf = [];
                    const flush = () => {
                        if(!buf.length) return;
                        const ps = buf.flatMap(n => parts(n, ctx.fmt)); buf = [];
                        const runs = toRuns(ps);
                        if(runs.length) out.push(new D.Paragraph({ children: runs, alignment: alignOf(ctx.align), indent: ctx.indent ? { left: ctx.indent } : undefined }));
                    };
                    parent.childNodes.forEach(n => { if(isBlock(n)) { flush(); out.push(...convertBlock(n, ctx)); } else buf.push(n); });
                    flush();
                    return out;
                };

                const convertList = (el, ctx) => {
                    const inst = ++olInstance;
                    return [...el.children].filter(li => li.tagName === 'LI').map(li => new D.Paragraph({
                        children: toRuns(parts(li, ctx.fmt)), alignment: alignOf(ctx.align || 'justify'),
                        numbering: { reference: 'ol', level: 0, instance: inst }, spacing: { after: 60 }
                    }));
                };

                const convertBlock = (el, ctx) => {
                    const tag = el.tagName;
                    if(tag === 'TABLE') return convertTable(el, ctx);
                    if(tag === 'OL' || tag === 'UL') return convertList(el, ctx);
                    if(tag === 'HR') return [spacer(120)];
                    const st = el.style, n = ctxFrom(el, ctx);
                    const before = len(st.marginTop) || 0, after = len(st.marginBottom) || 0;
                    const empty = !el.textContent.trim() && !el.querySelector('img');
                    const hasBlock = [...el.children].some(isBlock);
                    if(empty && !hasBlock && st.borderTopStyle && st.borderTopStyle !== 'none') {
                        return [new D.Paragraph({ children: [], run: { size: 2 },
                            border: { top: { style: D.BorderStyle.SINGLE, size: 18, color: '000000', space: 1 }, bottom: { style: D.BorderStyle.SINGLE, size: 6, color: '000000', space: 1 } },
                            spacing: { before: 60, after: 240, line: 20, lineRule: D.LineRuleType.EXACT } })];
                    }
                    if(empty && !hasBlock && len(st.height)) return [spacer(len(st.height))];
                    if(hasBlock) {
                        const inner = convertChildren(el, n);
                        return [...(before ? [spacer(before)] : []), ...inner, ...(after ? [spacer(after)] : [])];
                    }
                    const runs = toRuns(parts(el, n.fmt).length ? [...el.childNodes].flatMap(ch => parts(ch, n.fmt)) : []);
                    if(!runs.length) return after || before ? [spacer(before + after)] : [];
                    return [new D.Paragraph({ children: runs, alignment: alignOf(n.align), indent: n.indent ? { left: n.indent } : undefined,
                                              spacing: { before, after } })];
                };

                const convertTable = (tbl, ctx) => {
                    const rows = [...tbl.rows];
                    if(!rows.length) return [];
                    const tst = tbl.style;
                    const indent = len(tst.marginLeft, CW) || 0;
                    const avail = CW - indent;
                    const total = (tst.width && tst.width.endsWith('%')) ? Math.round(avail * parseFloat(tst.width) / 100) : null;
                    const ncol = Math.max(...rows.map(r => [...r.cells].reduce((a, c) => a + (c.colSpan || 1), 0)));
                    const spec = new Array(ncol).fill(null);
                    const cols = [...tbl.querySelectorAll(':scope > colgroup > col')];
                    if(cols.length) cols.forEach((c, i) => { if(i < ncol) spec[i] = len(c.style.width, total || avail); });
                    else { let ci = 0; [...rows[0].cells].forEach(c => { const sp = c.colSpan || 1; if(sp === 1 && c.style.width) spec[ci] = len(c.style.width, total || avail); ci += sp; }); }
                    // Lebar kolom yang tidak ditentukan: dibagi dari sisa lebar (tabel tanpa lebar: perkirakan dari panjang teks)
                    let widths;
                    if(total) {
                        const known = spec.reduce((a, v) => a + (v || 0), 0), unk = spec.filter(v => v === null).length;
                        widths = spec.map(v => v !== null ? v : Math.max(600, Math.floor((total - known) / Math.max(1, unk))));
                    } else {
                        widths = spec.map((v, i) => {
                            if(v !== null) return v;
                            let mx = 0; rows.forEach(r => { const c = r.cells[i]; if(c) mx = Math.max(mx, c.textContent.trim().length); });
                            return Math.min(4800, Math.max(700, mx * 115 + 240));
                        });
                        const used = widths.slice(0, -1).reduce((a, b) => a + b, 0);
                        widths[widths.length - 1] = Math.max(1200, Math.min(widths[widths.length - 1], avail - used));
                    }
                    const sum = widths.reduce((a, b) => a + b, 0);
                    const fit = sum > avail ? avail / sum : 1;
                    widths = widths.map(w => Math.floor(w * fit));

                    const trs = rows.map(r => {
                        let ci = 0;
                        const cells = [...r.cells].map(td => {
                            const sp = td.colSpan || 1, cs = td.style;
                            const w = widths.slice(ci, ci + sp).reduce((a, b) => a + b, 0); ci += sp;
                            const hasB = cs.borderTopStyle && cs.borderTopStyle !== 'none';
                            const b = hasB ? { style: D.BorderStyle.SINGLE, size: 6, color: '000000' } : none;
                            const cctx = ctxFrom(td, { ...ctx, align: undefined, indent: 0 });
                            let kids = convertChildren(td, cctx);
                            if(!kids.length) kids = [new D.Paragraph({ children: [] })];
                            return new D.TableCell({
                                width: { size: w, type: D.WidthType.DXA }, columnSpan: sp > 1 ? sp : undefined,
                                borders: { top: b, bottom: b, left: b, right: b },
                                margins: { top: len(cs.paddingTop) || 0, bottom: len(cs.paddingBottom) || 0, left: len(cs.paddingLeft) || 0, right: len(cs.paddingRight) || 0 },
                                verticalAlign: cs.verticalAlign === 'middle' ? D.VerticalAlign.CENTER : D.VerticalAlign.TOP,
                                children: kids
                            });
                        });
                        return new D.TableRow({ children: cells, cantSplit: true });
                    });
                    const table = new D.Table({
                        rows: trs, columnWidths: widths, width: { size: widths.reduce((a, b) => a + b, 0), type: D.WidthType.DXA },
                        layout: D.TableLayoutType.FIXED, indent: indent ? { size: indent, type: D.WidthType.DXA } : undefined,
                        borders: { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none }
                    });
                    const mt = len(tst.marginTop) || 0, mb = len(tst.marginBottom) || 0;
                    return [...(mt ? [spacer(mt)] : []), table, spacer(mb || 60)];
                };

                const sections = pages.map(pg => {
                    let kids = convertChildren(pg, { align: undefined, indent: 0, fmt: {} });
                    if(!kids.length) kids = [new D.Paragraph({ children: [] })];
                    return { properties: { page: { size: { width: W, height: H }, margin: { top: MY, bottom: MY, left: MX, right: MX } } }, children: kids };
                });
                const doc = new D.Document({
                    creator: 'SIM PKL', title: 'Surat',
                    styles: { default: { document: { run: { font: 'Arial', size: 22 }, paragraph: { spacing: { line: 276, lineRule: D.LineRuleType.AUTO } } } } },
                    numbering: { config: [{ reference: 'ol', levels: [{ level: 0, format: D.LevelFormat.DECIMAL, text: '%1.', alignment: D.AlignmentType.LEFT, style: { paragraph: { indent: { left: 360, hanging: 360 } } } }] }] },
                    sections
                });
                return D.Packer.toBlob(doc);
            }
        };
        window.WORD = WORD;

        /* ---------- Modul daftar untuk menu Manajemen Persuratan ---------- */
        const konsentrasiFilter = (matchFn) => ({ label: 'Semua konsentrasi', options: () => window.app.kompetensi.map(k => k.kode), match: matchFn });
        const suratBadges = (arsip) => arsip.length
            ? arsip.map(a => `<span title="${esc(a.nomor_lengkap + ' · ' + fmtDate(a.tanggal_surat))}" class="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-xs mr-1 mb-1">${esc(SURAT.JENIS[a.jenis].short)}</span>`).join('')
            : '<span class="text-xs text-slate-400">Belum ada</span>';

        function groupBy(rows, keyFn, init) {
            const map = new Map();
            rows.forEach(r => { const k = keyFn(r); if(!map.has(k)) map.set(k, { id: k, rows: [], ...init(r) }); map.get(k).rows.push(r); });
            return [...map.values()];
        }
        const minDate = (rows, f) => rows.map(r => r[f]).sort()[0];
        const maxDate = (rows, f) => rows.map(r => r[f]).sort().slice(-1)[0];

        // Pilih banyak baris lalu buat surat sekaligus (nomor otomatis berurutan)
        const selMixin = (key) => ({
            sel: new Set(),
            selCell: function(id) { return `<td class="p-4"><input type="checkbox" ${this.sel.has(id) ? 'checked' : ''} onchange="window.app.mod.${key}.pick('${esc(id)}', this.checked)"></td>`; },
            count: function() { const el = document.getElementById('cnt-' + key); if(el) el.textContent = this.sel.size; },
            pick: function(id, on) { if(on) this.sel.add(id); else this.sel.delete(id); this.count(); },
            selectVisible: function() { (window.app.list.visible[key] || []).forEach(d => this.sel.add(d.id)); window.app.list.apply(key); this.count(); },
            clear: function() { this.sel.clear(); window.app.list.apply(key); this.count(); },
            toolbar: function() {
                return `<button onclick="window.app.mod.${key}.selectVisible()" class="px-3 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm">Pilih semua yang tampil</button>
                        <button onclick="window.app.mod.${key}.clear()" class="px-3 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm">Kosongkan</button>
                        <button onclick="window.app.mod.${key}.buatTerpilih()" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold rounded-xl text-sm">Buat surat terpilih (<span id="cnt-${key}">${this.sel.size}</span>)</button>`;
            },
            terpilih: function() { return (window.app.list.rows[key] || []).filter(d => this.sel.has(d.id)); }
        });

        const suratTabs = (active) => `<div class="flex gap-2 mb-4">${[['suratIndustri','Permohonan'],['suratPengantar','Pengantar'],['suratPenarikan','Penarikan']].map(([k, l]) =>
            `<button onclick="window.app.list.show('${k}', document.getElementById('main-content'))" class="px-4 py-2 rounded-xl text-sm font-semibold ${k === active ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">${l}</button>`).join('')}</div>`;

        // Pengantar dan Penarikan: berdasarkan siswa yang sudah ditempatkan
        function makeIndustriMod(key, jenis, title) {
            return {
                ...selMixin(key), title, header: () => suratTabs(key),
                headers: ['','Industri','Periode PKL','Siswa','Surat Terbit','Aksi'],
                filter: konsentrasiFilter((d, v) => d.rows.some(r => r.siswa && r.siswa.kompetensi === v)),
                load: async function() {
                    const [rows, arsip] = await Promise.all([SURAT.loadPenempatan(), SURAT.loadArsipRingkas()]);
                    const groups = groupBy(rows.filter(r => r.industri), r => [r.industri_id, r.tgl_mulai, r.tgl_selesai].join('|'),
                        r => ({ industri: r.industri, tapel: r.tahun_pelajaran, tgl_mulai: r.tgl_mulai, tgl_selesai: r.tgl_selesai }));
                    return groups.map(g => ({ ...g, _arsip: arsip.filter(a => a.industri_id === g.industri.id && a.jenis === jenis && a.tahun_pelajaran_id === (g.tapel ? g.tapel.id : null)) }));
                },
                text: d => [d.industri.nama, d.industri.kota, ...d.rows.map(r => r.siswa && r.siswa.nama)].join(' '),
                row: function(d) {
                    const kodes = [...new Set(d.rows.map(r => r.siswa && r.siswa.kompetensi).filter(Boolean))].sort();
                    return `<tr class="border-b border-slate-100">${this.selCell(d.id)}
                        <td class="p-4"><strong>${esc(d.industri.nama)}</strong><br><span class="text-xs text-slate-500">${esc(d.industri.kota || '')}</span></td>
                        <td class="p-4 text-xs">${esc(d.tapel ? d.tapel.nama : '-')}<br>${fmtDate(d.tgl_mulai)} s.d ${fmtDate(d.tgl_selesai)}</td>
                        <td class="p-4">${d.rows.length} siswa<br>${kompBadges(kodes)}</td>
                        <td class="p-4">${suratBadges(d._arsip)}</td>
                        <td class="p-4">${actions(B('Buat Surat', `window.app.mod.${key}.buat('${esc(d.id)}')`, 'indigo'))}</td></tr>`;
                },
                buat: function(id) {
                    const g = window.app.list.find(key, id);
                    if(g) SURAT.openEditor(jenis, [g], `${g.industri.nama} · ${g.rows.length} siswa · ${fmtDate(g.tgl_mulai)} s.d ${fmtDate(g.tgl_selesai)}`, key);
                },
                buatTerpilih: function() {
                    const items = this.terpilih();
                    if(!items.length) return window.app.ui.showToast('Pilih minimal satu industri.', 'error');
                    SURAT.openEditor(jenis, items, `${items.length} surat akan dibuat sekaligus`, key);
                }
            };
        }

        function makeSiswaMod(key, jenis, title) {
            return {
                ...selMixin(key), title,
                headers: ['','Siswa','Industri','Guru Pembimbing','Periode','Surat Terbit','Aksi'],
                filter: konsentrasiFilter((d, v) => d.siswa && d.siswa.kompetensi === v),
                load: async function() {
                    const [rows, arsip] = await Promise.all([SURAT.loadPenempatan(), SURAT.loadArsipRingkas()]);
                    return rows.filter(r => r.siswa).map(r => ({ ...r, _arsip: arsip.filter(a => a.jenis === jenis && (a.siswa_ids || []).includes(r.siswa_id)) }));
                },
                text: d => [d.siswa.nama, d.siswa.nis, d.siswa.kelas, d.industri && d.industri.nama].join(' '),
                row: function(d) {
                    return `<tr class="border-b border-slate-100">${this.selCell(d.id)}
                        <td class="p-4"><strong>${esc(d.siswa.nama)}</strong><br><span class="text-xs text-slate-500">${esc(d.siswa.nis)} · ${esc(d.siswa.kelas)}</span></td>
                        <td class="p-4">${esc(d.industri ? d.industri.nama : '-')}</td>
                        <td class="p-4">${esc(d.guru ? d.guru.nama : '-')}</td>
                        <td class="p-4 text-xs">${fmtDate(d.tgl_mulai)} s.d ${fmtDate(d.tgl_selesai)}</td>
                        <td class="p-4">${suratBadges(d._arsip)}</td>
                        <td class="p-4">${actions(B('Buat Surat', `window.app.mod.${key}.buat('${esc(d.id)}')`, 'indigo'))}</td></tr>`;
                },
                buat: function(id) {
                    const r = window.app.list.find(key, id);
                    if(r) SURAT.openEditor(jenis, [r], `${r.siswa.nama} · ${r.industri ? r.industri.nama : '-'}`, key);
                },
                buatTerpilih: function() {
                    const items = this.terpilih();
                    if(!items.length) return window.app.ui.showToast('Pilih minimal satu siswa.', 'error');
                    SURAT.openEditor(jenis, items, `${items.length} surat akan dibuat sekaligus`, key);
                }
            };
        }

        const STATUS_PERMOHONAN = { diajukan: 'Menunggu jawaban', diterima: 'Diterima', ditolak: 'Ditolak', dibatalkan: 'Batalkan pengajuan' };

        Object.assign(window.app.mod, {

            /* ===== Surat ke Industri: Permohonan (disertai pencatatan jawaban industri) ===== */
            suratIndustri: {
                ...selMixin('suratIndustri'),
                title: 'Surat Permohonan PKL ke Industri', addLabel: 'Buat Pengajuan Baru',
                canAdd: () => true, header: () => suratTabs('suratIndustri'),
                headers: ['','Industri','Periode PKL','Status Jawaban Industri','Surat Terbit','Aksi'],
                filter: { label: 'Semua status', options: () => ['Menunggu jawaban','Ada yang diterima','Ada yang ditolak','Siap ditempatkan'],
                    match: (d, v) => ({ 'Menunggu jawaban': d._c.diajukan > 0, 'Ada yang diterima': d._c.diterima + d._c.ditempatkan > 0,
                                        'Ada yang ditolak': d._c.ditolak > 0, 'Siap ditempatkan': d._c.diterima > 0 }[v]) },
                load: async function() {
                    const [rows, arsip, pen] = await Promise.all([
                        q(sbClient.from('permohonan_pkl').select('id, siswa_id, industri_id, tahun_pelajaran_id, tgl_mulai, tgl_selesai, status, tgl_jawaban, catatan_jawaban, siswa(id, nama, nis, kelas, kompetensi), industri(id, nama, alamat, kota), tahun_pelajaran(id, nama)').neq('status', 'dibatalkan').order('created_at')),
                        SURAT.loadArsipRingkas(),
                        q(sbClient.from('penempatan').select('permohonan_id').not('permohonan_id', 'is', null).neq('status', 'dibatalkan'))
                    ]);
                    const placed = new Set(pen.map(p => p.permohonan_id));
                    const groups = groupBy(rows.filter(r => r.industri && r.siswa), r => [r.industri_id, r.tahun_pelajaran_id, r.tgl_mulai, r.tgl_selesai].join('|'),
                        r => ({ industri: r.industri, tapel: r.tahun_pelajaran, tgl_mulai: r.tgl_mulai, tgl_selesai: r.tgl_selesai }));
                    return groups.map(g => {
                        const c = { diajukan: 0, diterima: 0, ditolak: 0, ditempatkan: 0 };
                        g.rows.forEach(r => { if(r.status === 'diterima' && placed.has(r.id)) { c.ditempatkan++; r._placed = true; } else c[r.status]++; });
                        return { ...g, _c: c, _arsip: arsip.filter(a => a.industri_id === g.industri.id && a.jenis === 'industri_permohonan' && a.tahun_pelajaran_id === (g.tapel ? g.tapel.id : null)) };
                    });
                },
                text: d => [d.industri.nama, d.industri.kota, ...d.rows.map(r => r.siswa.nama)].join(' '),
                row: function(d) {
                    const c = d._c, chip = (n, label, tone) => n ? `<span class="inline-block px-2 py-0.5 ${tone} rounded text-xs mr-1 mb-1">${n} ${label}</span>` : '';
                    return `<tr class="border-b border-slate-100">${this.selCell(d.id)}
                        <td class="p-4"><strong>${esc(d.industri.nama)}</strong><br><span class="text-xs text-slate-500">${esc(d.industri.kota || '')}</span></td>
                        <td class="p-4 text-xs">${esc(d.tapel ? d.tapel.nama : '-')}<br>${fmtDate(d.tgl_mulai)} s.d ${fmtDate(d.tgl_selesai)}</td>
                        <td class="p-4">${d.rows.length} siswa diajukan<br>
                            ${chip(c.diajukan, 'menunggu', 'bg-amber-50 text-amber-700')}${chip(c.diterima, 'diterima, siap ditempatkan', 'bg-emerald-50 text-emerald-700')}${chip(c.ditempatkan, 'sudah ditempatkan', 'bg-indigo-50 text-indigo-700')}${chip(c.ditolak, 'ditolak', 'bg-rose-50 text-rose-700')}</td>
                        <td class="p-4">${suratBadges(d._arsip)}</td>
                        <td class="p-4">${actions(B('Buat Surat', `window.app.mod.suratIndustri.buat('${esc(d.id)}')`, 'indigo'),
                            B('Catat Jawaban', `window.app.mod.suratIndustri.openJawaban('${esc(d.id)}')`, 'amber'),
                            c.diterima > 0 && B('Ke Penempatan', `window.app.navigate('penempatan')`, 'emerald'))}</td></tr>`;
                },
                // Surat hanya memuat siswa yang masih diajukan atau sudah diterima
                item: function(g) { return { ...g, rows: g.rows.filter(r => ['diajukan','diterima'].includes(r.status)) }; },
                buat: function(id) {
                    const g = window.app.list.find('suratIndustri', id);
                    if(!g) return;
                    const it = this.item(g);
                    if(!it.rows.length) return window.app.ui.showToast('Semua siswa pada pengajuan ini ditolak. Tidak ada yang perlu dimohonkan.', 'error');
                    SURAT.openEditor('industri_permohonan', [it], `${g.industri.nama} · ${it.rows.length} siswa`, 'suratIndustri');
                },
                buatTerpilih: function() {
                    const items = this.terpilih().map(g => this.item(g)).filter(g => g.rows.length);
                    if(!items.length) return window.app.ui.showToast('Pilih minimal satu pengajuan yang masih memuat siswa.', 'error');
                    SURAT.openEditor('industri_permohonan', items, `${items.length} surat akan dibuat sekaligus`, 'suratIndustri');
                },

                /* --- Pengajuan baru: pilih industri, periode, dan siswa --- */
                pj: { siswa: [], blokir: [], ditolak: [], tapel: [] },
                openForm: async function() {
                    try {
                        const [industri, tapel, siswa, perm, pen] = await Promise.all([
                            q(sbClient.from('industri').select('id, nama, kota').eq('aktif', true).order('nama')),
                            q(sbClient.from('tahun_pelajaran').select('id, nama, tgl_mulai, tgl_selesai, status').order('tgl_mulai', { ascending: false })),
                            q(sbClient.from('siswa').select('id, nama, nis, kelas, kompetensi').eq('aktif', true).order('nama')),
                            q(sbClient.from('permohonan_pkl').select('siswa_id, tahun_pelajaran_id, status, industri(nama)').in('status', ['diajukan','diterima','ditolak'])),
                            q(sbClient.from('penempatan').select('siswa_id, tahun_pelajaran_id').neq('status', 'dibatalkan'))
                        ]);
                        this.pj = { siswa, tapel, ditolak: perm.filter(p => p.status === 'ditolak'),
