<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM PKL - SMK Negeri 1 Gombong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white mb-4 shadow-lg shadow-indigo-200">
                    <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">SIM PKL</h1>
                <p class="text-sm text-slate-500 mt-1">SMK Negeri 1 Gombong</p>
            </div>

            <div id="login-error" class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl hidden"></div>

            <form onsubmit="window.app.auth.login(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Email Akun</label>
                    <input type="email" id="login-email" required placeholder="email@smkn1gombong.sch.id" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition duration-200">
                    Masuk Aplikasi
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-wrapper" class="flex h-screen overflow-hidden hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-indigo-900 text-indigo-100 flex flex-col shadow-xl z-20">
            <div class="p-6 flex items-center gap-3 border-b border-indigo-800">
                <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center text-white">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white text-base">SIM PKL</h2>
                    <p class="text-xs text-indigo-300">SMKN 1 Gombong</p>
                </div>
            </div>

            <nav id="sidebar-menu" class="flex-1 overflow-y-auto p-4 space-y-1 text-sm">
                <!-- Injected dynamically -->
            </nav>

            <div class="p-4 border-t border-indigo-800">
                <button onclick="window.app.auth.logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-800/50 hover:bg-rose-600 text-indigo-200 hover:text-white transition duration-200 text-sm font-medium">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Keluar Sistem
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between z-10">
                <div class="flex items-center gap-4">
                    <h1 id="page-title" class="text-xl font-bold text-slate-800">Dashboard</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p id="user-display-name" class="font-semibold text-slate-800 text-sm">Administrator</p>
                        <p id="user-display-role" class="text-xs text-indigo-600 font-medium">Super Admin</p>
                    </div>
                    <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold" id="user-avatar">
                        A
                    </div>
                </div>
            </header>

            <main id="main-content" class="flex-1 overflow-y-auto p-8 bg-slate-50">
                <!-- Dynamic Content Views -->
            </main>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 px-5 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center gap-3">
        <span id="toast-msg">Notifikasi</span>
    </div>

    <!-- MODALS CONTAINER -->
    <div id="modals-container"></div>

    <script>
        const SUPABASE_URL = "https://ttxkwperndmpxfvhlnoe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_QG42NumYrIexUqfIHsTIwg_WSHqb5xD";
        let sbClient = null;
        try {
            sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Gagal inisialisasi Supabase:", e);
        }

        /* ================= KONSTANTA IZIN ================= */
        const ROLE_LABEL = {
            superadmin: 'Super Admin',
            pokja: 'Pokja PKL',
            guru: 'Guru Pembimbing',
            pembimbing_lapangan: 'Pembimbing Lapangan',
            siswa: 'Siswa'
        };

        // Lapisan 1: halaman yang boleh dibuka per role
        const ROLE_VIEWS = {
            superadmin: ['dashboard','tapel','industri','guru','siswa','penempatan','surat','presensi','jurnal','visitasi','penilaian'],
            pokja: ['dashboard','industri','guru','siswa','penempatan','surat','presensi','jurnal','visitasi','penilaian'],
            guru: ['dashboard','presensi','jurnal','visitasi'],
            pembimbing_lapangan: ['dashboard','presensi','jurnal','penilaian'],
            siswa: ['dashboard','presensi-siswa','jurnal-siswa']
        };

        // Lapisan 2: tabel yang boleh diubah/dihapus per role. RLS tetap penentu akhir.
        const PERM = {
            edit: {
                tahun_pelajaran: ['superadmin'],
                industri: ['superadmin','pokja'],
                guru: ['superadmin','pokja'],
                siswa: ['superadmin','pokja'],
                penempatan: ['superadmin','pokja'],
                visitasi: ['superadmin'],
                penilaian: ['superadmin']
            },
            del: {
                tahun_pelajaran: ['superadmin'],
                industri: ['superadmin'],
                guru: ['superadmin'],
                siswa: ['superadmin','pokja'],
                penempatan: ['superadmin','pokja'],
                visitasi: ['superadmin'],
                penilaian: ['superadmin']
            }
        };

        const MENU = [
            { id:'dashboard', label:'Dashboard', icon:'layout-dashboard', group:null },
            { id:'tapel', label:'Tahun Pelajaran', icon:'calendar', group:'Data Master' },
            { id:'industri', label:'Data Industri', icon:'building-2', group:'Data Master' },
            { id:'guru', label:'Data Guru', icon:'users', group:'Data Master' },
            { id:'siswa', label:'Data Siswa', icon:'graduation-cap', group:'Data Master' },
            { id:'penempatan', label:'Penempatan PKL', icon:'map-pin', group:'Data Master' },
            { id:'surat', label:'Surat Pengantar', icon:'file-text', group:'Kegiatan PKL' },
            { id:'presensi-siswa', label:'Presensi GPS', icon:'map-pin', group:'Kegiatan PKL' },
            { id:'presensi', label:'Rekap Presensi', icon:'clock', group:'Kegiatan PKL' },
            { id:'jurnal-siswa', label:'Jurnal Harian', icon:'book-open', group:'Kegiatan PKL' },
            { id:'jurnal', label:'Jurnal Kegiatan', icon:'book-open', group:'Kegiatan PKL', alt:{ guru:'Verifikasi Jurnal' } },
            { id:'visitasi', label:'Monitoring & Visitasi', icon:'eye', group:'Kegiatan PKL' },
            { id:'penilaian', label:'Penilaian Industri', icon:'award', group:'Kegiatan PKL', alt:{ pembimbing_lapangan:'Nilai & Rekap Akhir' } }
        ];

        /* ================= HELPER UMUM ================= */
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // Aman untuk string di dalam onclick='...': buang apostrof dan backslash, lalu escape HTML
        const jsq = (s) => esc(String(s ?? '').replace(/[\\']/g, ''));

        const fmtDate = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }) : '-';

        function friendlyError(err) {
            const code = err && err.code;
            const msg = (err && err.message) || String(err);
            if(code === '23503') return 'Data masih dipakai oleh data lain (misalnya penempatan). Nonaktifkan datanya, atau hapus keterkaitannya terlebih dahulu.';
            if(code === '23505') return 'Data sudah ada (duplikat NIS, email, atau isian unik lainnya).';
            if(code === '23P01') return 'Siswa sudah memiliki penempatan aktif pada periode yang bertabrakan.';
            if(code === '23514') return 'Ada isian yang tidak memenuhi aturan data (periksa tanggal dan angka).';
            if(code === '42501') return 'Anda tidak memiliki izin untuk tindakan ini.';
            return msg;
        }

        // Menjalankan query Supabase dan SELALU memeriksa error
        async function q(promise) {
            const res = await promise;
            if(res.error) throw new Error(friendlyError(res.error));
            return res.data || [];
        }

        // Insert/update satu baris, gagal jika tidak ada baris yang tersimpan (misalnya ditolak RLS)
        async function writeRow(table, id, payload) {
            const t = sbClient.from(table);
            const res = id ? await t.update(payload).eq('id', id).select('id') : await t.insert([payload]).select('id');
            if(res.error) throw new Error(friendlyError(res.error));
            if(!res.data || res.data.length === 0) throw new Error('Data tidak tersimpan (tidak ada izin atau data tidak ditemukan).');
            return res.data[0];
        }

        async function callManageUsers(payload) {
            if(!sbClient) throw new Error('Koneksi database tidak tersedia.');
            const { data, error } = await sbClient.functions.invoke('manage-users', { body: payload });
            if(error) {
                let msg = error.message;
                try { const j = await error.context.json(); if(j && j.error) msg = j.error; } catch(_) {}
                throw new Error(msg);
            }
            if(data && data.error) throw new Error(data.error);
            return data;
        }

        // Handler form generik: tombol dikunci selama proses, notifikasi sukses hanya jika benar-benar berhasil
        async function submitForm(e, modalId, okMsg, reloadKey, fn) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            const label = btn.textContent;
            btn.disabled = true; btn.textContent = 'Menyimpan...';
            try {
                await fn();
                window.app.ui.closeModal(modalId);
                window.app.ui.showToast(okMsg);
                if(reloadKey) window.app.list.reload(reloadKey);
            } catch(err) {
                window.app.ui.showToast('Gagal: ' + err.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = label;
            }
        }

        async function removeRow(table, id, reloadKey) {
            if(!window.app.canDelete(table)) return window.app.ui.showToast('Anda tidak berwenang menghapus data ini.', 'error');
            if(!confirm('Hapus data ini? Tindakan ini tidak dapat dibatalkan.')) return;
            try {
                if(!sbClient) throw new Error('Koneksi database tidak tersedia.');
                const res = await sbClient.from(table).delete().eq('id', id).select('id');
                if(res.error) throw new Error(friendlyError(res.error));
                if(!res.data || res.data.length === 0) throw new Error('Tidak ada data yang terhapus (tidak ada izin atau data tidak ditemukan).');
                window.app.ui.showToast('Berhasil dihapus!');
                if(reloadKey) window.app.list.reload(reloadKey);
                else if(table === 'visitasi') window.app.db.loadVisitasi();
                else if(table === 'penilaian') window.app.db.loadPenilaian();
            } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
        }

        async function removeAccount(userId, nama, reloadKey) {
            if(!confirm('Hapus akun dan data "' + nama + '"? Tindakan ini tidak dapat dibatalkan.')) return;
            try {
                await callManageUsers({ action: 'delete_user', user_id: userId });
                window.app.ui.showToast('Akun dan data berhasil dihapus!');
                if(reloadKey) window.app.list.reload(reloadKey);
            } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
        }

        async function resetPassword(userId, nama) {
            const pw = prompt('Password baru untuk ' + nama + ' (minimal 8 karakter):');
            if(pw === null) return;
            if(pw.length < 8) return window.app.ui.showToast('Password minimal 8 karakter.', 'error');
            try {
                await callManageUsers({ action: 'reset_password', user_id: userId, password: pw });
                window.app.ui.showToast('Password direset. Pengguna wajib menggantinya saat login.');
            } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
        }

        async function toggleAccount(userId, nama, aktifSekarang, reloadKey) {
            const aksi = aktifSekarang ? 'menonaktifkan' : 'mengaktifkan';
            if(!confirm('Yakin ingin ' + aksi + ' akun "' + nama + '"?')) return;
            try {
                await callManageUsers({ action: 'set_active', user_id: userId, aktif: !aktifSekarang });
                window.app.ui.showToast('Status akun diperbarui.');
                if(reloadKey) window.app.list.reload(reloadKey);
            } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
        }

        // Elemen UI kecil
        const BTN_TONE = {
            slate: 'bg-slate-100 text-slate-700', indigo: 'bg-indigo-50 text-indigo-700',
            rose: 'bg-rose-50 text-rose-700', amber: 'bg-amber-50 text-amber-700', emerald: 'bg-emerald-50 text-emerald-700'
        };
        const B = (label, js, tone = 'slate') => `<button onclick="${js}" class="px-3 py-1 ${BTN_TONE[tone]} rounded-lg text-xs font-semibold">${label}</button>`;
        const actions = (...btns) => `<div class="flex flex-wrap gap-1.5">${btns.filter(Boolean).join('')}</div>`;
        const statusBadge = (aktif) => aktif === false
            ? '<span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded text-xs">Nonaktif</span>'
            : '<span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-xs">Aktif</span>';
        const kompBadges = (kodes) => kodes.length
            ? kodes.map(k => `<span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-xs mr-1">${esc(k)}</span>`).join('')
            : '<span class="text-xs text-slate-400">-</span>';

        // Checkbox konsentrasi. Pokja hanya bisa mencentang konsentrasinya sendiri.
        function renderKompChecks(containerId, selected = []) {
            const app = window.app, isPokja = app.currentRole === 'pokja';
            document.getElementById(containerId).innerHTML = app.kompetensi.map(k => {
                const dis = isPokja && !app.currentKompetensi.includes(k.kode);
                const chk = selected.includes(k.kode);
                return `<label class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 text-sm ${dis ? 'opacity-50' : ''}"><input type="checkbox" value="${esc(k.kode)}" ${chk ? 'checked' : ''} ${dis ? 'disabled' : ''}> ${esc(k.kode)}</label>`;
            }).join('');
        }
        const readKompChecks = (containerId) => [...document.querySelectorAll('#' + containerId + ' input:checked')].map(i => i.value);

        // Select konsentrasi tunggal (siswa), dibatasi untuk Pokja
        function fillKompSelect(selectId, selectedKode) {
            const app = window.app;
            const opts = app.kompetensi.filter(k => app.currentRole !== 'pokja' || app.currentKompetensi.includes(k.kode));
            document.getElementById(selectId).innerHTML = opts.map(k => `<option value="${esc(k.kode)}">${esc(k.kode)} - ${esc(k.nama)}</option>`).join('');
            if(selectedKode && opts.some(k => k.kode === selectedKode)) document.getElementById(selectId).value = selectedKode;
        }

        const val = (id) => document.getElementById(id).value.trim();
        const setVal = (id, v) => { document.getElementById(id).value = v ?? ''; };

        /* ================= APLIKASI ================= */
        window.app = {
            currentUser: null,
            currentRole: null,
            currentKompetensi: [],
            kompetensi: [],

            can: function(view) {
                return view === 'dashboard' || (ROLE_VIEWS[this.currentRole] || []).includes(view);
            },
            canEdit: function(table) { return (PERM.edit[table] || []).includes(this.currentRole); },
            canDelete: function(table) { return (PERM.del[table] || []).includes(this.currentRole); },
            // Superadmin boleh semua; Pokja hanya jika data terkait salah satu konsentrasinya
            manageByKomp: function(kodes) {
                if(this.currentRole === 'superadmin') return true;
                if(this.currentRole !== 'pokja') return false;
                return (kodes || []).some(k => this.currentKompetensi.includes(k));
            },

            init: async function() {
                lucide.createIcons();
                if(!sbClient) {
                    const box = document.getElementById('login-error');
                    box.textContent = 'Koneksi database Supabase tidak tersedia.';
                    box.classList.remove('hidden');
                    return;
                }
                try {
                    const { data: { session } } = await sbClient.auth.getSession();
                    if(session) {
                        const ok = await this.auth.bootstrapSession();
                        if(!ok) await sbClient.auth.signOut();
                    }
                } catch(e) { console.error(e); }

                sbClient.auth.onAuthStateChange((event) => {
                    if(event === 'SIGNED_OUT') location.reload();
                });
            },

            auth: {
                login: async function(e) {
                    e.preventDefault();
                    const email = document.getElementById('login-email').value.trim();
                    const pass = document.getElementById('login-password').value;
                    const errBox = document.getElementById('login-error');
                    const btn = e.target.querySelector('button[type=submit]');
                    errBox.classList.add('hidden');
                    btn.disabled = true;
                    btn.textContent = 'Memproses...';
                    try {
                        if(!sbClient) throw new Error('Koneksi database Supabase tidak tersedia.');
                        const { error } = await sbClient.auth.signInWithPassword({ email, password: pass });
                        if(error) throw new Error('Email atau password salah.');
                        const ok = await window.app.auth.bootstrapSession();
                        if(!ok) {
                            await sbClient.auth.signOut();
                            throw new Error('Akun Anda belum memiliki profil aktif. Hubungi admin sekolah.');
                        }
                    } catch(err) {
                        errBox.textContent = err.message;
                        errBox.classList.remove('hidden');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Masuk Aplikasi';
                    }
                },

                // Role selalu dibaca dari tabel profiles berdasarkan akun Auth yang sedang login.
                bootstrapSession: async function() {
                    try {
                        const { data: { user }, error: uErr } = await sbClient.auth.getUser();
                        if(uErr || !user) return false;

                        const { data: p, error } = await sbClient.from('profiles')
                            .select('id, email, nama, role, aktif, must_change_password')
                            .eq('id', user.id).maybeSingle();
                        if(error || !p || !p.aktif) return false;

                        let kompetensi = [];
                        if(p.role === 'pokja') {
                            const r = await sbClient.from('pokja_assignments')
                                .select('kompetensi_keahlian(kode)').eq('profile_id', p.id);
                            if(r.error) return false;
                            kompetensi = (r.data || []).map(x => x.kompetensi_keahlian && x.kompetensi_keahlian.kode).filter(Boolean);
                        }

                        const app = window.app;
                        app.kompetensi = await q(sbClient.from('kompetensi_keahlian').select('id, kode, nama').order('kode'));
                        app.currentUser = { id: p.id, nama: p.nama, email: p.email, role: p.role };
                        app.currentRole = p.role;
                        app.currentKompetensi = kompetensi;

                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app-wrapper').classList.remove('hidden');
                        app.ui.renderSidebar();
                        app.navigate('dashboard');
                        if(p.must_change_password) app.auth.promptChangePassword();
                        return true;
                    } catch(e) {
                        console.error(e);
                        return false;
                    }
                },

                logout: async function() {
                    try { if(sbClient) await sbClient.auth.signOut(); } catch(e) {}
                    location.reload();
                },

                promptChangePassword: function() {
                    if(document.getElementById('modal-pw')) return;
                    document.getElementById('modals-container').insertAdjacentHTML('beforeend', `
                        <div id="modal-pw" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
                                <h3 class="font-bold text-lg text-slate-900 mb-1">Ganti password</h3>
                                <p class="text-sm text-slate-500 mb-4">Password awal dari admin harus diganti sebelum Anda melanjutkan.</p>
                                <form onsubmit="window.app.auth.changePassword(event)" class="space-y-4">
                                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Password baru (minimal 8 karakter)</label><input type="password" id="pw-baru" minlength="8" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm"></div>
                                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Ulangi password baru</label><input type="password" id="pw-ulang" minlength="8" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm"></div>
                                    <div class="flex justify-end"><button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm">Simpan password</button></div>
                                </form>
                            </div>
                        </div>`);
                },

                changePassword: async function(e) {
                    e.preventDefault();
                    const p1 = document.getElementById('pw-baru').value;
                    const p2 = document.getElementById('pw-ulang').value;
                    if(p1.length < 8) return window.app.ui.showToast('Password minimal 8 karakter.', 'error');
                    if(p1 !== p2) return window.app.ui.showToast('Kedua password tidak sama.', 'error');
                    try {
                        const r1 = await sbClient.auth.updateUser({ password: p1 });
                        if(r1.error) throw r1.error;
                        const r2 = await sbClient.from('profiles').update({ must_change_password: false }).eq('id', window.app.currentUser.id);
                        if(r2.error) throw r2.error;
                        document.getElementById('modal-pw').remove();
                        window.app.ui.showToast('Password berhasil diganti.');
                    } catch(err) {
                        window.app.ui.showToast('Gagal mengganti password: ' + err.message, 'error');
                    }
                }
            },

            ui: {
                showToast: function(msg, type = 'success') {
                    const toast = document.getElementById('toast');
                    const msgEl = document.getElementById('toast-msg');
                    msgEl.textContent = msg;

                    document.getElementById('user-avatar').textContent = app.currentUser.nama.charAt(0).toUpperCase();

                    const allowed = ROLE_VIEWS[role] || ['dashboard'];

                }
                const titles = {
                    'dashboard': 'Dashboard SIM PKL',

                    'industri': 'Data Industri / Tempat PKL',
                    'guru': 'Data Guru Pembimbing',
                    'siswa': 'Data Siswa PKL',
                    'penempatan': 'Penempatan & Plotting PKL',
                    'surat': 'Surat Pengantar PKL',
                    'presensi': 'Rekap Presensi Harian',
                    'jurnal': 'Verifikasi Jurnal Kegiatan',
                    'visitasi': 'Monitoring & Visitasi Industri',
                    'penilaian': 'Penilaian Nilai PKL Industri',
                    'presensi-siswa': 'Presensi Masuk & Pulang GPS',
                    'jurnal-siswa': 'Input Jurnal Kegiatan Harian'
                };
                document.getElementById('page-title').textContent = titles[view] || 'SIM PKL';

            formatWA: function(hp) {
                if(!hp) return '-';
                let clean = String(hp).replace(/\D/g,'');
                if(clean.startsWith('0')) clean = '62' + clean.slice(1);
                return `<a href="https://wa.me/${clean}" target="_blank" rel="noopener" class="text-emerald-600 hover:underline flex items-center gap-1 font-medium"><i data-lucide="message-circle" class="w-4 h-4"></i>${esc(hp)}</a>`;
            },

            /* ---------- Mesin tabel generik: pencarian, filter, loading, error ---------- */
            list: {
                rows: {},
                find: function(key, id) { return (this.rows[key] || []).find(r => r.id === id); },

                show: function(key, container) {
                    const m = window.app.mod[key];
                    const filterHtml = m.filter
                        ? `<select id="filter-${key}" onchange="window.app.list.apply('${key}')" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm"><option value="">${esc(m.filter.label)}</option>${m.filter.options().map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`
                        : '';
                    const addHtml = m.addLabel && m.canAdd()
                        ? `<button onclick="window.app.mod.${key}.openForm()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> ${esc(m.addLabel)}</button>`
                        : '';
                    container.innerHTML = `
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                            <div class="p-6 border-b border-slate-100 flex flex-wrap gap-3 justify-between items-center">
                                <h3 class="font-bold text-slate-900">${esc(m.title)}</h3>
                                <div class="flex flex-wrap gap-3 items-center">
                                    <input id="search-${key}" oninput="window.app.list.apply('${key}')" type="search" placeholder="Cari..." class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm w-48">
                                    ${filterHtml}${addHtml}
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead><tr class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-100">${m.headers.map(h => `<th class="p-4">${esc(h)}</th>`).join('')}</tr></thead>
                                    <tbody id="tbody-${key}"></tbody>
                                </table>
                            </div>
                        </div>`;
                    this.reload(key);
                },

                reload: async function(key) {
                    const m = window.app.mod[key];
                    const tbody = document.getElementById('tbody-' + key);
                    if(!tbody) return;
                    const cols = m.headers.length;
                    tbody.innerHTML = `<tr><td colspan="${cols}" class="p-6 text-center text-slate-400">Memuat data...</td></tr>`;
                    try {
                        this.rows[key] = await m.load();
                        this.apply(key);
                    } catch(err) {
                        tbody.innerHTML = `<tr><td colspan="${cols}" class="p-6 text-center text-rose-600">Gagal memuat data: ${esc(err.message)} <button onclick="window.app.list.reload('${key}')" class="underline ml-2">Coba lagi</button></td></tr>`;
                    }
                },

                apply: function(key) {
                    const m = window.app.mod[key];
                    const tbody = document.getElementById('tbody-' + key);
                    if(!tbody) return;
                    const sEl = document.getElementById('search-' + key), fEl = document.getElementById('filter-' + key);
                    const s = sEl ? sEl.value.toLowerCase().trim() : '';
                    const f = fEl ? fEl.value : '';
                    const all = this.rows[key] || [];
                    const rows = all.filter(d => (!s || m.text(d).toLowerCase().includes(s)) && (!f || m.filter.match(d, f)));
                    tbody.innerHTML = rows.length
                        ? rows.map(d => m.row(d)).join('')
                        : `<tr><td colspan="${m.headers.length}" class="p-6 text-center text-slate-400">${all.length ? 'Tidak ada data yang cocok.' : 'Belum ada data.'}</td></tr>`;
                    lucide.createIcons();
                }
            },

                    if(!sbClient) return;
                    const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
                    try {
                        const [ind, sis, gur, pen] = await Promise.all([
                            sbClient.from('industri').select('*', { count: 'exact', head: true }),
                            sbClient.from('siswa').select('*', { count: 'exact', head: true }),
                            sbClient.from('guru').select('*', { count: 'exact', head: true }),
                            sbClient.from('penempatan').select('*', { count: 'exact', head: true }).eq('status', 'aktif')
                        ]);
                        set('stat-ind', ind.error ? '-' : (ind.count || 0));
                        set('stat-sis', sis.error ? '-' : (sis.count || 0));
                        set('stat-guru', gur.error ? '-' : (gur.count || 0));
                        set('stat-pen', pen.error ? '-' : (pen.count || 0));
                    } catch(e) { console.error(e); }
                },

                failRow: function(tbody, cols, err) {
                    tbody.innerHTML = `<tr><td colspan="${cols}" class="p-6 text-center text-rose-600">Gagal memuat data: ${esc(err.message)}</td></tr>`;
                },

                loadPresensi: async function() {
                    const tbody = document.getElementById('tbody-presensi');
                    if(!tbody) return;
                    try {
                        const data = await q(sbClient.from('presensi').select('*'));
                        if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada data.</td></tr>'; return; }
                        tbody.innerHTML = data.map(d => `<tr class="border-b border-slate-100"><td class="p-4 text-xs">${esc(new Date(d.waktu).toLocaleString())}</td><td class="p-4">${esc(d.siswa_id)}</td><td class="p-4">${esc(d.jenis)}</td><td class="p-4 text-xs text-emerald-600">${esc(d.status_otomatis || 'Valid')}</td></tr>`).join('');
                    } catch(err) { this.failRow(tbody, 4, err); }
                },

                loadJurnalVerif: async function() {
                    const tbody = document.getElementById('tbody-jurnal-verif');
                    if(!tbody) return;
                    try {
                        const data = await q(sbClient.from('jurnal').select('*'));
                        if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">Belum ada data.</td></tr>'; return; }
                        tbody.innerHTML = data.map(d => `<tr class="border-b border-slate-100"><td class="p-4 text-xs">${esc(d.tanggal)}</td><td class="p-4">${esc(d.siswa_id)}</td><td class="p-4 text-xs">${esc(d.uraian)}</td><td class="p-4">${esc(d.status)}</td><td class="p-4"><button onclick="window.app.db.updateJurnalStatus('${esc(d.id)}','Approved')" class="px-3 py-1 bg-emerald-600 text-white rounded text-xs">Setujui</button></td></tr>`).join('');
                    } catch(err) { this.failRow(tbody, 5, err); }
                },
                updateJurnalStatus: async function(id, status) {
                    try {
                        await writeRow('jurnal', id, { status: status });
                        window.app.ui.showToast('Status jurnal diperbarui!');
                        this.loadJurnalVerif();
                    } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
                },

                loadVisitasi: async function() {
                    const tbody = document.getElementById('tbody-visitasi');
                    if(!tbody) return;
                    try {
                        const data = await q(sbClient.from('visitasi').select('*'));
                        if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada data.</td></tr>'; return; }
                        tbody.innerHTML = data.map(d => `<tr class="border-b border-slate-100"><td class="p-4">${esc(d.tanggal)}<br><span class="text-xs">${esc(d.nama_guru)}</span></td><td class="p-4">${esc(d.nama_industri)}</td><td class="p-4 text-xs">${esc(d.catatan)}</td><td class="p-4"><button onclick="removeRow('visitasi','${esc(d.id)}','')" class="px-3 py-1 bg-rose-50 text-rose-700 rounded text-xs">Hapus</button></td></tr>`).join('');
                    } catch(err) { this.failRow(tbody, 4, err); }
                },
                openModalVisitasi: async function() {
                    const ind = document.getElementById('vis-industri');
                    ind.innerHTML = '<option value="">Pilih Industri</option>';
                    try {
                        const rows = await q(sbClient.from('industri').select('id, nama').order('nama'));
                        rows.forEach(i => ind.innerHTML += `<option value="${esc(i.id)}" data-name="${esc(i.nama)}">${esc(i.nama)}</option>`);
                    } catch(err) { window.app.ui.showToast('Gagal memuat industri: ' + err.message, 'error'); }
                    window.app.ui.openModal('modal-visitasi-container');
                },
                saveVisitasi: async function(e) {
                    e.preventDefault();
                    const ind = document.getElementById('vis-industri');
                    const payload = {
                        guru_id: window.app.currentUser.id,
                        nama_guru: window.app.currentUser.nama,
                        industri_id: ind.value,
                        nama_industri: ind.selectedIndex > 0 ? ind.options[ind.selectedIndex].getAttribute('data-name') : '-',
                        tanggal: document.getElementById('vis-tgl').value,
                        catatan: document.getElementById('vis-catatan').value
                    };
                    try {
                        await writeRow('visitasi', null, payload);
                        window.app.ui.closeModal('modal-visitasi-container');
                        window.app.ui.showToast('Visitasi disimpan!');
                        this.loadVisitasi();
                    } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
                },

                loadPenilaian: async function() {
                    const tbody = document.getElementById('tbody-penilaian');
                    if(!tbody) return;
                    try {
                        const data = await q(sbClient.from('penilaian').select('*'));
                        if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada data.</td></tr>'; return; }
                        tbody.innerHTML = data.map(d => `<tr class="border-b border-slate-100"><td class="p-4"><strong>${esc(d.nama_siswa)}</strong><br><span class="text-xs">${esc(d.nama_industri)}</span></td><td class="p-4 text-xs">Disiplin: ${esc(d.nilai_disiplin)}, Teknis: ${esc(d.nilai_teknis)}</td><td class="p-4"><strong>${esc(d.nilai_akhir)}</strong></td><td class="p-4"><button onclick="removeRow('penilaian','${esc(d.id)}','')" class="px-3 py-1 bg-rose-50 text-rose-700 rounded text-xs">Hapus</button></td></tr>`).join('');
                    } catch(err) { this.failRow(tbody, 4, err); }
                },
                openModalNilai: async function() {
                    const s = document.getElementById('nil-siswa');
                    s.innerHTML = '<option value="">Pilih Siswa</option>';
                    try {
                        const rows = await q(sbClient.from('penempatan').select('siswa_id, siswa(nama), industri(nama)').eq('status', 'aktif'));
                        rows.forEach(p => {
                            const sn = p.siswa ? p.siswa.nama : '-', inn = p.industri ? p.industri.nama : '-';
                            s.innerHTML += `<option value="${esc(p.siswa_id)}" data-name="${esc(sn)}" data-ind="${esc(inn)}">${esc(sn)} (${esc(inn)})</option>`;
                        });
                    } catch(err) { window.app.ui.showToast('Gagal memuat siswa: ' + err.message, 'error'); }
                    window.app.ui.openModal('modal-nilai-container');
                },
                saveNilai: async function(e) {
                    e.preventDefault();
                    const s = document.getElementById('nil-siswa');
                    const d = parseFloat(document.getElementById('nil-disiplin').value) || 0;
                    const t = parseFloat(document.getElementById('nil-teknis').value) || 0;
                    const k = parseFloat(document.getElementById('nil-kerjasama').value) || 0;
                    const i = parseFloat(document.getElementById('nil-inisiatif').value) || 0;
                    const akhir = ((d + t + k + i) / 4).toFixed(2);
                    const payload = {
                        siswa_id: s.value,
                        nama_siswa: s.selectedIndex > 0 ? s.options[s.selectedIndex].getAttribute('data-name') : '-',
                        nama_industri: s.selectedIndex > 0 ? s.options[s.selectedIndex].getAttribute('data-ind') : '-',
                        nilai_disiplin: d,
                        nilai_teknis: t,
                        nilai_kerjasama: k,
                        nilai_inisiatif: i,
                        nilai_akhir: parseFloat(akhir)
                    };
                    try {
                        await writeRow('penilaian', null, payload);
                        window.app.ui.closeModal('modal-nilai-container');
                        window.app.ui.showToast('Nilai disimpan!');
                        this.loadPenilaian();
                    } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
                },

                initGPSCheck: function() {
                    const box = document.getElementById('gps-status-box');
                    if(navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(pos => {
                            box.innerHTML = `<strong class="text-emerald-700">GPS Aktif:</strong> Lat: ${pos.coords.latitude.toFixed(5)}, Lng: ${pos.coords.longitude.toFixed(5)}`;
                        }, err => { box.innerHTML = `<strong class="text-rose-700">GPS Error:</strong> ${esc(err.message)}`; });
                    }
                },
                submitPresensi: async function(jenis) {
                    const payload = {
                        siswa_id: window.app.currentUser.nis || window.app.currentUser.nama,
                        penempatan_id: 'default-pen',
                        tanggal: new Date().toISOString().split('T')[0],
                        waktu: new Date().toISOString(),
                        jenis: jenis,
                        status_otomatis: 'Valid GPS'
                    };
                    try {
                        await writeRow('presensi', null, payload);
                        window.app.ui.showToast(`Presensi ${jenis} berhasil!`);
                    } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
                },

                loadJurnalSiswa: async function() {
                    const wrap = document.getElementById('riwayat-jurnal-siswa');
                    if(!wrap) return;
                    try {
                        const data = await q(sbClient.from('jurnal').select('*').eq('siswa_id', window.app.currentUser.nis || window.app.currentUser.nama));
                        if(data.length === 0) { wrap.innerHTML = '<p class="text-sm text-slate-400">Belum ada jurnal.</p>'; return; }
                        wrap.innerHTML = data.map(d => `<div class="p-4 bg-slate-50 rounded-xl text-sm"><div class="flex justify-between"><strong>${esc(d.tanggal)}</strong><span>${esc(d.status)}</span></div><p>${esc(d.uraian)}</p></div>`).join('');
                    } catch(err) { wrap.innerHTML = `<p class="text-sm text-rose-600">Gagal memuat riwayat: ${esc(err.message)}</p>`; }
                },
                saveJurnalSiswa: async function(e) {
                    e.preventDefault();
                    const payload = {
                        siswa_id: window.app.currentUser.nis || window.app.currentUser.nama,
                        penempatan_id: 'default-pen',
                        tanggal: document.getElementById('j-tgl').value,
                        jam_mulai: document.getElementById('j-mulai').value,
                        jam_selesai: document.getElementById('j-selesai').value,
                        uraian: document.getElementById('j-uraian').value,
                        status: 'Submitted'
                    };
                    try {
                        await writeRow('jurnal', null, payload);
                        window.app.ui.showToast('Jurnal terkirim!');
                        this.loadJurnalSiswa();
                    } catch(err) { window.app.ui.showToast('Gagal: ' + err.message, 'error'); }
                }
            }
        };

        /* ================= MODAL ================= */

        const WRAP = (id, width, inner) => `<div id="${id}" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"><div class="bg-white rounded-2xl shadow-xl ${width} w-full p-6 max-h-[90vh] overflow-y-auto">${inner}</div></div>`;

                </form>`),

            WRAP('modal-industri-container', 'max-w-xl', `
                <h3 id="ind-title" class="font-bold text-lg text-slate-900 mb-4">Form Data Industri</h3>

                    </div>
                    <div><label class="${LBL}">Radius presensi (meter, 10 - 5000)</label><input type="number" id="ind-radius" value="100" min="10" max="5000" required class="${INP}"></div>
                    <div><label class="${LBL}">Konsentrasi keahlian yang dapat ditempatkan di industri ini</label><div id="ind-komp" class="flex flex-wrap gap-2"></div></div>

            WRAP('modal-pl-container', 'max-w-lg', `

                    </div>
                    ${FOOT('modal-pl-container')}
                </form>`),

            WRAP('modal-guru-container', 'max-w-lg', `
                <h3 id="guru-title" class="font-bold text-lg text-slate-900 mb-4">Form Data Guru</h3>
                <form onsubmit="window.app.mod.guru.save(event)" class="space-y-4">
                    <input type="hidden" id="guru-id">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">NIP</label><input type="text" id="guru-nip" class="${INP}"></div>

                    <div class="grid grid-cols-2 gap-4">

                    </div>
                    ${FOOT('modal-siswa-container')}
                </form>`),

            WRAP('modal-penempatan-container', 'max-w-lg', `

                    ${FOOT('modal-penempatan-container')}
                </form>`),

            // Modal visitasi dan nilai: dipertahankan, disempurnakan di Tahap 4
            WRAP('modal-visitasi-container', 'max-w-lg', `
                <h3 class="font-bold text-lg text-slate-900 mb-4">Form Visitasi</h3>
                <form onsubmit="window.app.db.saveVisitasi(event)" class="space-y-4">

                    <div><label class="${LBL}">Catatan</label><textarea id="vis-catatan" rows="3" required class="${INP}"></textarea></div>

            WRAP('modal-nilai-container', 'max-w-lg', `
                <h3 class="font-bold text-lg text-slate-900 mb-4">Form Nilai Industri</h3>

                    <div class="grid grid-cols-2 gap-4">

                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="${LBL}">Kerjasama (0-100)</label><input type="number" id="nil-kerjasama" min="0" max="100" required class="${INP}"></div>
                        <div><label class="${LBL}">Inisiatif (0-100)</label><input type="number" id="nil-inisiatif" min="0" max="100" required class="${INP}"></div>
                    </div>
                    ${FOOT('modal-nilai-container')}
                </form>`)

        ].join('');

        window.addEventListener('DOMContentLoaded', () => {
            window.app.init();
        });
    </script>
</body>
